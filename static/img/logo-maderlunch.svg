<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MaderLunch">
  <title>MaderLunch</title>
  <!-- Hintergrund: abgerundetes Quadrat in Mader-Blau -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#009fe3"/>

  <!-- Dekorativer Kreis (oberer Bogen) -->
  <path d="M 96 240 A 160 130 0 0 1 416 240" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.55" stroke-linecap="round"/>
  <path d="M 96 272 A 160 130 0 0 0 416 272" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.55" stroke-linecap="round"/>

  <!-- Gabel (links), stilisiert -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="78" y="148" width="9" height="56" rx="3"/>
    <rect x="96" y="148" width="9" height="56" rx="3"/>
    <rect x="114" y="148" width="9" height="56" rx="3"/>
    <rect x="91" y="200" width="18" height="184" rx="6"/>
  </g>

  <!-- Löffel (rechts), stilisiert -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="421" cy="178" rx="22" ry="34"/>
    <rect x="412" y="208" width="18" height="176" rx="6"/>
  </g>

  <!-- ML-Wortmarke, fett und bold-italic-mäßig anmutend -->
  <g fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-weight="900" font-style="italic">
    <text x="256" y="320" font-size="200" text-anchor="middle" letter-spacing="-6">ML</text>
  </g>

  <!-- "MaderLunch"-Schriftzug -->
  <text x="256" y="380" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700"
        font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="0">MaderLunch</text>
</svg>
